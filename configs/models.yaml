models:
  tfidf_logreg:
    type: sklearn
    vectorizer: tfidf
    classifier: logistic_regression
    params:
      ngram_range: [1, 2]
      max_features: 50000
      C: 1.0

  tfidf_svm:
    type: sklearn
    vectorizer: tfidf
    classifier: linear_svc
    params:
      ngram_range: [1, 2]
      max_features: 50000
      C: 1.0

  bilstm_fasttext:
    type: bilstm
    vocab_size: 200000
    embed_dim: 300
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    max_length: 128
    notes: BiLSTM with character n-gram (FastText-style) embeddings, trained from scratch

  afro_xlmr_base:
    type: transformer
    hf_id: Davlan/afro-xlmr-base
    max_length: 128
    notes: African-tuned XLM-R, strong default for SA languages

  afriberta_large:
    type: transformer
    hf_id: castorini/afriberta_large
    max_length: 128
    notes: trained on African corpora, weaker for Afrikaans

  xlm_roberta_base:
    type: transformer
    hf_id: FacebookAI/xlm-roberta-base
    max_length: 128
    notes: general multilingual baseline

  mbert:
    type: transformer
    hf_id: google-bert/bert-base-multilingual-cased
    max_length: 128
    notes: classic multilingual baseline

default: afro_xlmr_base
