[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-analysis"
version = "0.1.0"
description = "Multilabel emotion analysis for South African languages (isiZulu, isiXhosa, Afrikaans) using BRIGHTER + EthioEmo."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "COS 760 Team" }
]
keywords = ["nlp", "african-languages", "emotion-analysis", "multilabel", "low-resource"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch>=2.4 guarantees NumPy 2 compatibility and satisfies transformers'
    # minimum. Apple Silicon (arm64) and Windows both have wheels; x86_64 macOS
    # caps at torch 2.2.2 (no newer wheel) — use a native arm64 Python on M-series.
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "evaluate>=0.4",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.24",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "safetensors>=0.4",
    "iterative-stratification>=0.1.7",
]

[project.optional-dependencies]
explain = [
    # Wheel-only across arm64 macOS + Windows. LIME is the primary explainer;
    # Captum covers attention attribution.
    "lime>=0.2.0.1",
    "captum>=0.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# SHAP pulls numba/llvmlite which build from source on some toolchains
# (notably x86_64 macOS). Install separately when needed: pip install -e ".[shap]"
shap = [
    "shap>=0.45",
]
augment = [
    "nlpaug>=1.1.11",
    "deep-translator>=1.11",
    "sacremoses>=0.1",
]
track = [
    "wandb>=0.17",
    "mlflow>=2.15",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
ea-train = "emotion_analysis.cli:train"
ea-eval = "emotion_analysis.cli:evaluate"
ea-download = "emotion_analysis.cli:download"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests",
    "gpu: requires GPU",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
